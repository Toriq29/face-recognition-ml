<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Face Classifier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 50px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: inline-block;
        }

        input[type="file"] {
            margin: 20px 0;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        img {
            margin-top: 20px;
            border-radius: 10px;
        }

        p {
            font-size: 18px;
            color: #333;
        }

        h2, h3 {
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Upload Gambar Wajah</h2>
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <br>
            <button type="submit">Prediksi</button>
        </form>

        {% if filename %}
            <h3>Hasil:</h3>
            <img src="{{ url_for('static', filename='uploads/' + filename) }}" width="200">
            <p><strong>Prediksi:</strong> {{ prediction }}</p>
        {% endif %}
    </div>
</body>
</html>
